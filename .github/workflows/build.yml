name: Build EXE
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name RemoteDesk --collect-all aiortc --collect-all aioice --collect-all pylibsrtp --collect-all av --collect-all google_crc32c remotedesk.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-exe
          path: dist/RemoteDesk.exe
