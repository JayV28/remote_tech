name: Build EXE
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name RemoteDesk remotedesk.py
      - run: pyinstaller --onefile --name RelayServer server.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-exe
          path: dist/*.exe
